site_name: Docs as Code

theme:
  name: material
  language: ru

  palette:
    - scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-night
        name: Включить светлую матрицу
    - scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Вернуться в киберпанк

  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/cyberpunk.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.14.0/dist/mermaid.min.js
  - javascripts/neon-mermaid.js

nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md
  - API:
      - Обзор: api/index.md

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: neon-mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
