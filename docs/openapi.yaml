openapi: 3.0.3

info:
  title: Конспектор API
  description: |
    API ИИ-помощника «Конспектор»: преподаватель загружает учебные материалы,
    студент задаёт вопросы и получает ответы со ссылками на источники.

    **Как это работает.** Материалы разбиваются на фрагменты и индексируются.
    На вопрос система находит наиболее похожие фрагменты, а языковая модель
    формулирует ответ только на их основе. Если подходящих фрагментов нет,
    ответ не выдумывается, а возвращается статус `no_answer`.

    **Авторизация.** Все операции требуют заголовок
    `Authorization: Bearer <token>`. Загрузка материалов и просмотр их статуса
    доступны только роли «преподаватель».

    **Ошибки.** Все ошибки возвращаются в одном формате: поля `code`
    (машиночитаемый код) и `message` (описание на английском).
  version: 1.0.0

servers:
  - url: https://example.com/api/v1
    description: Условный адрес, реальный сервер в рамках практикума не разворачивается

tags:
  - name: Вопросы и ответы
    description: Вопросы студентов и ответы системы с источниками
  - name: Учебные материалы
    description: Загрузка материалов и контроль их индексации

security:
  - bearerAuth: []

paths:
  /questions:
    post:
      tags:
        - Вопросы и ответы
      operationId: askQuestion
      summary: Задать вопрос по материалам
      description: |
        Принимает вопрос студента и возвращает ответ, построенный только на
        загруженных учебных материалах, вместе со списком источников.

        Если в материалах нет подходящей информации, возвращается код `200`
        со статусом `no_answer`: текст ответа содержит пояснение, а список
        источников пуст.

        Время ожидания ответа ограничено 10 секундами. Если ответ не получен,
        возвращается ошибка `503` с кодом `MODEL_UNAVAILABLE`, вопрос можно
        отправить повторно.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
      responses:
        '200':
          description: Запрос обработан. Статус ответа показывает, найдена ли информация в материалах
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
              examples:
                answered:
                  summary: Ответ найден
                  value:
                    id: 123
                    questionId: 456
                    status: answered
                    text: Docs as Code — подход, при котором документация хранится в Git рядом с кодом и собирается теми же инструментами, что и программа.
                    topSimilarity: 0.87
                    sources:
                      - chunkId: 3012
                        documentId: 7
                        documentTitle: Лекция 1. Docs as Code.pdf
                        page: 4
                        section: null
                        fragment: Docs as Code — это подход, при котором документацию создают и поддерживают теми же инструментами, что и код.
                        similarity: 0.87
                      - chunkId: 3140
                        documentId: 9
                        documentTitle: Конспект. Git и GitHub.md
                        page: null
                        section: Зачем нужен Git
                        fragment: Хранение документации в репозитории даёт историю изменений и возможность ревью.
                        similarity: 0.74
                    modelVersion: rag-1.0.0
                    createdAt: '2026-10-24T12:30:00Z'
                no_answer:
                  summary: В материалах ответа нет
                  value:
                    id: 124
                    questionId: 457
                    status: no_answer
                    text: В материалах ответа не найдено. Попробуйте переформулировать вопрос.
                    topSimilarity: 0.21
                    sources: []
                    modelVersion: rag-1.0.0
                    createdAt: '2026-10-24T12:31:10Z'
        '400':
          description: Некорректный вопрос (пустой или длиннее 500 символов)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                empty:
                  summary: Пустой вопрос
                  value:
                    code: INVALID_QUESTION
                    message: Question must not be empty
                tooLong:
                  summary: Слишком длинный вопрос
                  value:
                    code: INVALID_QUESTION
                    message: Question must be at most 500 characters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ModelUnavailable'

  /answers/{id}:
    get:
      tags:
        - Вопросы и ответы
      operationId: getAnswer
      summary: Получить ответ и его источники
      description: |
        Возвращает ранее сформированный ответ. Для каждого источника указаны
        название материала, страница или раздел и текст исходного фрагмента,
        поэтому студент может проверить достоверность ответа.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор ответа
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 123
      responses:
        '200':
          description: Ответ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /documents:
    post:
      tags:
        - Учебные материалы
      operationId: uploadDocument
      summary: Загрузить учебный материал
      description: |
        Принимает файл и ставит его в очередь на индексацию. Индексация
        выполняется асинхронно: сразу после загрузки материал имеет статус
        `processing`, а статус можно проверить запросом `GET /documents/{id}`.
        Доступно только роли «преподаватель».
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '202':
          description: Файл принят, индексация запущена
          headers:
            Location:
              description: Адрес созданного материала
              schema:
                type: string
                example: /api/v1/documents/7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Некорректный запрос (например, не передан файл)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: File is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Размер файла превышает 20 МБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FILE_TOO_LARGE
                message: File size must not exceed 20 MB
        '415':
          description: Неподдерживаемый формат файла (допустимы PDF, Markdown и TXT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNSUPPORTED_FORMAT
                message: Supported formats are pdf, md and txt
        '500':
          $ref: '#/components/responses/InternalError'

  /documents/{id}:
    get:
      tags:
        - Учебные материалы
      operationId: getDocument
      summary: Получить статус учебного материала
      description: |
        Возвращает сведения о материале и статус его индексации. По материалу
        можно задавать вопросы, когда статус равен `indexed` («Проиндексирован»).
        Доступно только роли «преподаватель».
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор материала
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 7
      responses:
        '200':
          description: Материал найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа, полученный при входе в систему

  schemas:
    QuestionRequest:
      type: object
      description: Вопрос студента
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Текст вопроса на естественном языке
          example: Что такое Docs as Code?

    Answer:
      type: object
      description: Ответ системы на вопрос
      required:
        - id
        - questionId
        - status
        - text
        - sources
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор ответа
          example: 123
        questionId:
          type: integer
          format: int64
          description: Идентификатор вопроса, на который дан ответ
          example: 456
        status:
          type: string
          enum:
            - answered
            - no_answer
          description: |
            `answered` — ответ сформирован по найденным фрагментам;
            `no_answer` — подходящих фрагментов в материалах нет
          example: answered
        text:
          type: string
          description: Текст ответа или пояснение, почему ответа нет
          example: Docs as Code — подход, при котором документация хранится в Git рядом с кодом.
        topSimilarity:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Сходство лучшего найденного фрагмента с вопросом (от 0 до 1)
          example: 0.87
        sources:
          type: array
          maxItems: 3
          description: Фрагменты материалов, на которых основан ответ (от наиболее релевантного)
          items:
            $ref: '#/components/schemas/Source'
        modelVersion:
          type: string
          description: Версия ИИ-конвейера, сформировавшего ответ
          example: rag-1.0.0
        createdAt:
          type: string
          format: date-time
          description: Время формирования ответа
          example: '2026-10-24T12:30:00Z'

    Source:
      type: object
      description: Источник ответа — фрагмент учебного материала
      required:
        - chunkId
        - documentId
        - documentTitle
        - fragment
      properties:
        chunkId:
          type: integer
          format: int64
          description: Идентификатор фрагмента
          example: 3012
        documentId:
          type: integer
          format: int64
          description: Идентификатор материала
          example: 7
        documentTitle:
          type: string
          description: Название материала
          example: Лекция 1. Docs as Code.pdf
        page:
          type: integer
          nullable: true
          description: Номер страницы (для PDF), для остальных форматов null
          example: 4
        section:
          type: string
          nullable: true
          description: Название раздела (для Markdown и TXT), для PDF может быть null
          example: Зачем нужен Git
        fragment:
          type: string
          description: Текст исходного фрагмента
          example: Docs as Code — это подход, при котором документацию создают теми же инструментами, что и код.
        similarity:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Сходство фрагмента с вопросом (от 0 до 1)
          example: 0.87

    DocumentUploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Файл материала (PDF, Markdown или TXT, не более 20 МБ)
        title:
          type: string
          maxLength: 200
          description: Название материала. Если не указано, используется имя файла
          example: Лекция 1. Docs as Code

    Document:
      type: object
      description: Учебный материал
      required:
        - id
        - title
        - format
        - status
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор материала
          example: 7
        title:
          type: string
          description: Название материала
          example: Лекция 1. Docs as Code
        format:
          type: string
          enum:
            - pdf
            - md
            - txt
          description: Формат файла
          example: pdf
        status:
          type: string
          enum:
            - processing
            - indexed
            - failed
          description: |
            Статус индексации: `processing` — идёт обработка,
            `indexed` — проиндексирован, `failed` — обработать файл не удалось
          example: processing
        sizeBytes:
          type: integer
          description: Размер файла в байтах
          example: 1048576
        uploadedAt:
          type: string
          format: date-time
          description: Время загрузки
          example: '2026-10-24T10:15:00Z'

    Error:
      type: object
      description: Описание ошибки
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: INVALID_QUESTION
        message:
          type: string
          description: Описание ошибки
          example: Question must not be empty

  responses:
    Unauthorized:
      description: Не передан токен доступа или он недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Access token is missing or invalid
    Forbidden:
      description: Операция недоступна для роли пользователя (нужна роль «преподаватель»)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Teacher role is required
    NotFound:
      description: Объект с указанным идентификатором не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Resource with the given id was not found
    ModelUnavailable:
      description: Языковая модель временно недоступна или не ответила в течение 10 секунд
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: MODEL_UNAVAILABLE
            message: Language model is temporarily unavailable, try again later
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Internal server error
